name: Android native-mod dev APKs
run-name: Android native-mod dev · ${{ github.sha }}

on:
  push:
    branches: [android-native, android-native2]
    paths:
      - 'native-mods/**'
      - 'tools/apply_native_mods.py'
      - '.github/workflows/android-native-dev.yml'
  workflow_dispatch:
    inputs:
      all_abis:
        description: Also build ARMv7, x86 and x86_64
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: android-native-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Never expose a signing secret to pull requests or arbitrary dispatch refs.
    if: startsWith(github.ref, 'refs/heads/android-native')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.all_abis && '["arm64-v8a","armeabi-v7a","x86","x86_64"]' || '["arm64-v8a"]') }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Restore the saved dev signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .local/keystore-cache
          key: native-dev-keystore-v1
      - name: Restore dedicated dev signing identity
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, shutil, subprocess
          from pathlib import Path
          value = os.environ.get('DEV_KEYSTORE', '')
          path = Path('.local/android/debug.keystore')
          saved = Path('.local/keystore-cache/debug.keystore')
          path.parent.mkdir(parents=True, exist_ok=True)
          saved.parent.mkdir(parents=True, exist_ok=True)
          if value:
              path.write_bytes(base64.b64decode(value, validate=True))
          else:
              # No secret: reuse the key saved by an earlier run, or make one once and save it,
              # so every build is signed alike and installs over the last without uninstalling.
              if not saved.exists():
                  subprocess.run(['keytool', '-genkeypair', '-keystore', str(saved), '-storepass', 'android',
                                  '-keypass', 'android', '-alias', 'androiddebugkey', '-keyalg', 'RSA',
                                  '-keysize', '2048', '-validity', '10000', '-dname', 'CN=Android Debug,O=Android,C=US'],
                                 check=True)
              shutil.copyfile(saved, path)
          path.chmod(0o600)
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'
      - name: Install Android toolchain
        env:
          ABI: ${{ matrix.abi }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86) target=i686-linux-android ;;
            x86_64) target=x86_64-linux-android ;;
          esac
          rustup target add "$target"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: android-native-dev-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            android-dev-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
      - name: Apply native mods (horizon-mixins)
        env:
          # Horizon launcher's pinned tool (crates/horizon-mod-package/src/mixins_tool.rs REV).
          MIXINS_REV: ${{ vars.MIXINS_REV || 'e59da9094f0c2fdda6c627fe9eff22dec6a906f0' }}
          MIXINS_REPO: ${{ vars.MIXINS_REPO || 'https://github.com/horizon-rust/horizon-mixins' }}
          # sha256 of tools/mixins/narrow-reference-rule.patch (used if the file is not in this checkout)
          MIXINS_PATCH_SHA: ${{ vars.MIXINS_PATCH_SHA || '52eaeef7cac10d894066635dc46b12f76d877416317f06eaf385f176de5e1c35' }}
          MIXINS_RELEASES: https://github.com/arismoko/horizon/releases/download
          MIXINS_TOKEN: ${{ secrets.MIXINS_TOKEN }}   # only if the source repo is private
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/mixins"; mkdir -p "$dest/bin"
          patch=tools/mixins/narrow-reference-rule.patch
          if [[ -f "$patch" ]]; then psha=$(sha256sum "$patch" | cut -d' ' -f1); else psha="$MIXINS_PATCH_SHA"; fi
          target=x86_64-unknown-linux-gnu
          tag="mixins-tool-${MIXINS_REV:0:12}-${psha:0:12}"
          url="$MIXINS_RELEASES/$tag/horizon-mixins-$target.tar.gz"

          # 1) Prebuilt tool published by the fork (no access to the mixins source repo needed).
          got=0
          if curl -fsSL "$url" -o "$RUNNER_TEMP/mixins.tgz"; then
            mkdir -p "$RUNNER_TEMP/mixins-x" && tar -xzf "$RUNNER_TEMP/mixins.tgz" -C "$RUNNER_TEMP/mixins-x"
            id=$(find "$RUNNER_TEMP/mixins-x" -name identity.txt | head -n1 || true)
            bin=$(find "$RUNNER_TEMP/mixins-x" -type f -name horizon-mixins | head -n1 || true)
            if [[ -n "$bin" && -n "$id" ]] && grep -qx "rev = $MIXINS_REV" "$id" && grep -qx "patch = $psha" "$id"; then
              install -m 0755 "$bin" "$dest/bin/horizon-mixins"; got=1; echo "Using prebuilt tool $tag"
            else
              echo "::warning::Prebuilt archive did not match rev/patch; building from source."
            fi
          else
            echo "::warning::No prebuilt tool at $url; building from source."
          fi

          # 2) Build from source, carrying the launcher's patch.
          if [[ "$got" != 1 ]]; then
            if [[ -n "$MIXINS_TOKEN" ]]; then
              git config --global url."https://x-access-token:${MIXINS_TOKEN}@github.com/".insteadOf "https://github.com/"
            fi
            git ls-remote "$MIXINS_REPO" HEAD >/dev/null \
              || { echo "::error::Cannot read $MIXINS_REPO and no prebuilt tool at $url. Set repo variable MIXINS_REPO, or secret MIXINS_TOKEN."; exit 1; }
            src="$RUNNER_TEMP/mixins-src"
            git clone "$MIXINS_REPO" "$src" && git -C "$src" checkout "$MIXINS_REV"
            if [[ -f "$patch" ]]; then git -C "$src" apply --whitespace=nowarn "$GITHUB_WORKSPACE/$patch"; else echo "::warning::$patch missing; building the tool without the launcher patch."; fi
            cargo install --locked --root "$dest" --path "$src/$(cd "$src" && ls -d */horizon-mixins-cli 2>/dev/null | head -n1 || echo .)"
          fi

          python3 tools/apply_native_mods.py --mods native-mods --cli "$dest/bin/horizon-mixins"
      - name: Use Mojang's original 26.3 version file
        run: |
          # Mojang republished 26.3.json; Horizon only accepts the original (content-addressed, still served).
          mkdir -p .local/minecraft/26.3
          curl -fsSL https://piston-meta.mojang.com/v1/packages/11f1aefe473eefba0af62e3286c33b692807b2eb/26.3.json \
            -o .local/minecraft/26.3/manifest.json
          test "$(sha1sum .local/minecraft/26.3/manifest.json | cut -d' ' -f1)" = 11f1aefe473eefba0af62e3286c33b692807b2eb
      - name: Prepare private engine inputs from official downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Build optimized public dev APK
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 tools/android_build.py --abi "$ABI" --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Collect only audited APK and public metadata
        env:
          ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          out = Path('dist')
          out.mkdir()
          sha, abi = os.environ['GITHUB_SHA'], os.environ['ABI']
          name = f'Horizon-Android-dev.{os.environ["GITHUB_RUN_NUMBER"]}.{sha[:12]}-{abi}.apk'
          apk = out / name
          shutil.copyfile(Path('.local/android/apk') / abi / 'horizon-android-public.apk', apk)
          (out / 'SHA256SUMS.txt').write_text(f'{hashlib.sha256(apk.read_bytes()).hexdigest()}  {name}\n')
          for source, dest in [('LICENSE', 'LICENSE.txt'), ('THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_NOTICES.md')]:
              shutil.copyfile(source, out / dest)
          (out / 'BUILD.json').write_text(json.dumps({'commit': sha, 'abi': abi, 'profile': 'release',
              'package': 'dev.horizon.android.dev', 'experimental': True, 'native_mods': True,
              'run': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Dev APK: {abi}\n\nCommit: `{sha}`. Optimized release profile; experimental build.\n\n'
                  'Download the APK artifact below. Installs separately from the stable app. '
                  'Existing worlds/accounts are not copied automatically.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-native-dev-${{ github.run_number }}-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f .local/android/debug.keystore
        
